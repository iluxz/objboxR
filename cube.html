<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>signal detected</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' fill='%23020304' stroke='%235fa8d3'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%239fd4ff'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;cursor:grab;font-family:'Consolas',monospace;color:#9fd4ff}
body.dragging{cursor:grabbing}
canvas{display:block;position:fixed;top:0;left:0}
#terminal{position:fixed;bottom:0;left:0;width:100%;height:180px;background:rgba(0,0,0,0.9);border-top:1px solid #333;color:#0f0;font-family:'Consolas',monospace;font-size:12px;overflow:auto;padding:10px;z-index:20;pointer-events:auto;display:none}
#terminal input{width:100%;background:transparent;border:none;color:#0f0;font-family:'Consolas',monospace;font-size:12px;outline:none;padding:4px 0}
#termOutput{white-space:pre-wrap;word-wrap:break-word}
#stats{position:fixed;top:10px;right:10px;color:#5fa8d3;font-size:12px;z-index:20;pointer-events:none;text-align:right;line-height:1.6}
#clock{position:fixed;top:10px;left:10px;color:#9fd4ff;font-size:14px;z-index:20;pointer-events:none}
#hint{position:fixed;bottom:190px;left:10px;color:#555;font-size:11px;z-index:20;pointer-events:none}
#objBar{position:fixed;top:0;left:0;width:100%;height:32px;background:rgba(0,0,0,0.7);border-bottom:1px solid #222;color:#9fd4ff;font-size:12px;padding:8px 16px;z-index:20;pointer-events:none;opacity:0;transition:opacity 0.3s}
#objBar.visible{opacity:1}
#objBar .who{color:#5fa8d3;margin-right:8px}
#shapePalette{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px}
.shape-btn{width:36px;height:36px;border:1px solid #333;background:rgba(0,0,0,0.5);color:#9fd4ff;font-size:10px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center}
.shape-btn:hover{border-color:#5fa8d3;background:rgba(95,168,211,0.1)}
#themeIndicator{position:fixed;bottom:10px;right:10px;color:#555;font-size:10px;z-index:20;pointer-events:none}
</style>
</head>
<body>
<canvas id="main"></canvas>
<div id="clock"></div>
<div id="stats">fps: --</div>
<div id="objBar"><span class="who">obj</span><span id="objText"></span></div>
<div id="shapePalette"></div>
<div id="terminal">
  <div id="termOutput"></div>
  <input id="termInput" placeholder="type a command..." autocomplete="off">
</div>
<div id="hint">drag to rotate | scroll to zoom | 1-5 themes | ` terminal</div>
<div id="themeIndicator">theme: void</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="cube-engine.js"></script>
</body>
</html>
